# Solo sirve el build estático del editor (apps/web) con fallback de SPA.
# La API (apps/api, puerto 3000) NO pasa por acá -- se expone directo desde
# Node/systemd, sin nginx en el medio. Esto evita el problema de que las
# rutas de la API (/auth, /diagrams, /projects) y las rutas del propio SPA
# viven ambas en la raíz, sin ningún prefijo común que nginx pueda usar
# para distinguirlas. El frontend ya sabe pegarle a otra URL vía
# VITE_API_URL (ver deploy.sh), así que no hace falta resolverlo acá.
server {
    listen 80;
    server_name _;

    root /var/www/sharegrams/web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
