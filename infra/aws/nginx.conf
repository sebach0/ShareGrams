# Solo sirve el build estático del editor (apps/web) con fallback de SPA.
# La API (apps/api, puerto 3000) NO pasa por acá en texto plano -- se expone
# directo desde Node/systemd, sin nginx en el medio. Esto evita el problema
# de que las rutas de la API (/auth, /diagrams, /projects) y las rutas del
# propio SPA viven ambas en la raíz, sin ningún prefijo común que nginx
# pueda usar para distinguirlas. El frontend ya sabe pegarle a otra URL vía
# VITE_API_URL (ver deploy.sh), así que no hace falta resolverlo acá.
#
# server_name usa un hostname de sslip.io (resuelve al alias de la propia IP
# pública, sin DNS propio) en vez de "_" porque Certbot necesita un hostname
# real -- no existe forma de emitirle un certificado TLS válido a una IP
# pelada -- y no hay presupuesto/alcance para comprar un dominio propio en
# este proyecto académico. Ver infra/aws/README.md, sección HTTPS, para cómo
# se obtuvo el certificado (certbot certonly --webroot) y por qué hace
# falta: sin contexto seguro (HTTPS o localhost) el navegador bloquea el
# micrófono del asistente de voz (Fase 6) y, una vez servido el editor por
# HTTPS, también bloquearía como "mixed content" cualquier llamada a la API
# si esta siguiera en HTTP plano -- de ahí el segundo bloque (:3443).
server {
    listen 80;
    server_name 34-207-109-145.sslip.io;

    root /var/www/sharegrams/web;

    # Certbot valida el certificado (y sus renovaciones) pidiendo este path
    # por HTTP plano -- tiene que responder 200 sin pasar por el redirect de
    # abajo.
    location /.well-known/acme-challenge/ {
        root /var/www/sharegrams/web;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 34-207-109-145.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-207-109-145.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-207-109-145.sslip.io/privkey.pem;

    root /var/www/sharegrams/web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# Reverse proxy HTTPS hacia la API (Node/systemd en :3000, sin TLS propio).
# Puerto separado (no un location /api/ bajo el :443 de arriba) a propósito,
# para no reabrir el problema de rutas de API y rutas de SPA compartiendo la
# raíz que ya explica el comentario de arriba -- mismo patrón que ya existía
# entre :80 (web) y :3000 (api) en texto plano, ahora espejado en HTTPS.
server {
    listen 3443 ssl;
    server_name 34-207-109-145.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-207-109-145.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-207-109-145.sslip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
